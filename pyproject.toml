[project]
name = "edu-by"
version = "0.1.0"
description = "Utilities and agent skills for operating the edu.by site constructor"
readme = "CLAUDE.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.27",
    "typer>=0.12",
    "pydantic-settings>=2.3",
    "playwright>=1.45",
    "mcp>=1.9,<2",  # MCP server (task 5): official Python SDK, FastMCP
    "pillow>=10",  # shrink photos to the ~300 KB upload limit (`object upload --shrink`)
]

[project.scripts]
edu = "edu_by.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_by"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
